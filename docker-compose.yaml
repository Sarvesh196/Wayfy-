services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wayfy-db
    environment:
      POSTGRES_DB: wayfy
      POSTGRES_USER: wayfy
      POSTGRES_PASSWORD: wayfy_dev
    ports:
      - "5432:5432"
    volumes:
      - wayfy-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wayfy-redis
    ports:
      - "6379:6379"

volumes:
  wayfy-db-data: